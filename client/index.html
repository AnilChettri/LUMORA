<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    
    <!-- SEO Meta Tags -->
    <title>Lumi - Your Mental Health Companion</title>
    <meta name="description" content="A compassionate AI-powered mental health companion featuring mood tracking, guided exercises, calming music, journaling, and a supportive community. Take care of your mind with Lumi." />
    <meta name="keywords" content="mental health, wellness, mindfulness, meditation, mood tracking, anxiety relief, stress management, self-care" />
    <meta name="author" content="Lumi Mental Health" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumi - Your Mental Health Companion" />
    <meta property="og:description" content="A compassionate AI-powered mental health companion featuring mood tracking, guided exercises, calming music, journaling, and a supportive community." />
    <meta property="og:image" content="/Quantum Shift.jpg" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumi - Your Mental Health Companion" />
    <meta name="twitter:description" content="A compassionate AI-powered mental health companion featuring mood tracking, guided exercises, calming music, journaling, and a supportive community." />
    
    <!-- PWA Configuration -->
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumi" />
    
    <!-- Icons -->
    <link rel="icon" type="image/jpeg" href="/Quantum Shift.jpg" />
    <link rel="apple-touch-icon" href="/Quantum Shift.jpg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts - Inter, Sora for display, JetBrains Mono for data -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
